; =====================================================================
; N03 IoT – PlatformIO Configuration
; Dùng cho VS Code + PlatformIO + Wokwi Extension
; Hệ thống tập trung đo độ ẩm đất và điều khiển tưới tự động
; =====================================================================

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Thư viện cần thiết
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    blynkkk/Blynk@^1.3.2

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Upload settings cho Wokwi simulation
board_build.filesystem = spiffs
